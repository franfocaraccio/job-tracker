<div class="row min-vh-100 align-items-center justify-content-center">
  <div class="col-sm-8 col-md-6 col-lg-4">
    <p class="text-center fs-2 fw-bold mb-3"><span class="text-success">Job</span>Tracker</p>

    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">
        <h1 class="h6 fw-semibold mb-1">Login to your account</h1>
        <p class="small text-body-secondary mb-4">Enter your email below to login to your account</p>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="email">Email</label>
            <input id="email" type="email" class="form-control rounded-pill" placeholder="m@example.com" formControlName="email" />
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold" for="password">Password</label>
            <input id="password" type="password" class="form-control rounded-pill" formControlName="password" />
          </div>

          <button type="submit" class="btn btn-success rounded-pill w-100" [disabled]="form.invalid">Login</button>
        </form>

        <p class="small text-center text-body-secondary mt-4 mb-0">
          Don't have an account? <a routerLink="/register" class="link-success text-decoration-none">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
