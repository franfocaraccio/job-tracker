<div class="row min-vh-100 align-items-center justify-content-center">
  <div class="col-sm-10 col-md-8 col-lg-5">
    <p class="text-center fs-2 fw-bold mb-3"><span class="text-success">Job</span>Tracker</p>

    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">
        @if (id === null) {
          <h1 class="h6 fw-semibold mb-1">New application</h1>
          <p class="small text-body-secondary mb-4">Add a position you applied to</p>
        } @else {
          <h1 class="h6 fw-semibold mb-1">Edit application</h1>
          <p class="small text-body-secondary mb-4">Update the details or move it to the next stage</p>
        }

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="company">Company</label>
            <input id="company" class="form-control rounded-pill" placeholder="Ballast Lane" formControlName="company" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" for="position">Position</label>
            <input id="position" class="form-control rounded-pill" placeholder=".NET Developer" formControlName="position" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" for="appliedOn">Applied on</label>
            <input id="appliedOn" type="date" class="form-control rounded-pill" [max]="today" formControlName="appliedOn" />
          </div>

          @if (id !== null) {
            <div class="mb-3">
              <label class="form-label small fw-semibold" for="status">Status</label>
              <select id="status" class="form-select rounded-pill" formControlName="status">
                @for (status of statusOptions(); track status) {
                  <option [value]="status">{{ status }}</option>
                }
              </select>
            </div>
          }

          <div class="d-flex gap-2 mt-4">
            <a routerLink="/applications" class="btn btn-outline-secondary rounded-pill w-50">Cancel</a>
            <button type="submit" class="btn btn-success rounded-pill w-50" [disabled]="form.invalid">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
