services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d

  api:
    build:
      context: .
      dockerfile: src/JobTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Username=postgres;Password=jobtracker;Database=jobtracker;Gss Encryption Mode=Disable
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  web:
    build: ./web
    ports:
      - "4200:80"
    depends_on:
      - api
